<#if ( show == "vote" ||  show== "all") && rating?? >
	${rating.ratingCount!}
</#if>
<#if !voteClosed> 
<#if ( show=="actionVote" || show== "all" ) && canDeleteVote >
<div>
<#list ratingList as rat >
	<form action="jsp/site/plugins/extend/modules/rating/DoCancelVote.jsp" method="post">
		<input type="hidden" name="idExtendableResource" value="${idExtendableResource!}" />
		<input type="hidden" name="extendableResourceType" value="${extendableResourceType!}" />
		<input type="hidden" name="ratingValue" value="${rat.ratingValue!}" />
		<input type="hidden" name="token" value="${cancelVoteToken!}" />
		<button type="submit">J'annule mon vote</button>
	</form>
	</br>
</#list>
</div>
<#elseif ( show== "all" || show=="actionVote") && canVote >
<div>
	<div class="extend-rating-vote-title">
		<label for="">Votez :</label>
	</div>
	<form action="jsp/site/plugins/extend/modules/rating/DoVote.jsp" method="post">
		<input type="hidden" name="idExtendableResource" value="${idExtendableResource!}" />
		<input type="hidden" name="extendableResourceType" value="${extendableResourceType!}" />
		<input type="hidden" name="ratingValue" value="1" />
		<input type="hidden" name="token" value="${voteToken!}" />
		<button type="submit">Je vote pour</button>
	</form>
</div>
</#if>
</#if>
